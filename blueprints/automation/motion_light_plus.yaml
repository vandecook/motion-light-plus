# Motion Light Plus
# Version: 1.0.0
# License: MIT

blueprint:
  name: Motion Light Plus - Smart Motion Lighting
  description: >-
    Flexible motion-controlled light automation with one or more motion sensors,
    optional illuminance control, night dimming, optional color temperature,
    permanent-light override, cleaning mode, automation-disable switch,
    restart fallback and watchdog safety shutdown.
  domain: automation
  homeassistant:
    min_version: 2024.6.0

  input:
    devices:
      name: Devices
      icon: mdi:devices
      input:
        motion_sensors:
          name: Motion sensors
          description: >-
            Select one or more motion/presence binary sensors. Any sensor turning
            on can activate the light. The light is only allowed to switch off
            after all selected sensors are off for the configured delay.
          selector:
            entity:
              filter:
                - domain: binary_sensor
              multiple: true

        light_entity:
          name: Light
          selector:
            entity:
              filter:
                - domain: light

        illuminance_sensor:
          name: Illuminance sensor
          description: >-
            Optional. If empty, the lux check is skipped completely.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: illuminance

    brightness:
      name: Brightness
      icon: mdi:brightness-6
      input:
        lux_threshold:
          name: Lux threshold
          description: >-
            With an illuminance sensor configured, motion only turns the light
            on below this value.
          default: 80
          selector:
            number:
              min: 0
              max: 2000
              step: 1
              unit_of_measurement: lx
              mode: box

        normal_brightness:
          name: Day brightness
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    night:
      name: Night mode
      icon: mdi:weather-night
      input:
        night_enabled:
          name: Enable night mode
          default: true
          selector:
            boolean:

        night_start:
          name: Night mode starts
          default: "22:00:00"
          selector:
            time:

        night_end:
          name: Night mode ends
          default: "06:00:00"
          selector:
            time:

        night_brightness:
          name: Night brightness
          default: 20
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    color_temperature:
      name: Color temperature
      icon: mdi:temperature-kelvin
      collapsed: true
      input:
        color_temp_enabled:
          name: Use color temperature
          description: >-
            Optional. Enable only for lights that support adjustable white
            color temperature. If disabled, all Kelvin settings are ignored.
          default: false
          selector:
            boolean:

        normal_color_temp:
          name: Day color temperature
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

        night_color_temp:
          name: Night color temperature
          default: 2500
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

        override_color_temp:
          name: Permanent-light color temperature
          default: 4000
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

        cleaning_color_temp:
          name: Cleaning color temperature
          default: 4500
          selector:
            color_temp:
              unit: kelvin
              min: 2000
              max: 6500

    timing:
      name: Motion & timing
      icon: mdi:timer-outline
      input:
        no_motion_wait:
          name: Switch-off delay after no motion
          description: >-
            The delay starts when a selected motion sensor changes to off. The
            light is switched off only if all selected motion sensors are still
            off after this time.
          default: 300
          selector:
            number:
              min: 10
              max: 3600
              step: 10
              unit_of_measurement: seconds
              mode: box

        startup_delay:
          name: Delay after Home Assistant start
          description: >-
            Gives Zigbee, Z-Wave, MQTT and other integrations time to restore
            their entity states before the restart fallback is evaluated.
          default: 30
          selector:
            number:
              min: 5
              max: 300
              step: 5
              unit_of_measurement: seconds
              mode: box

        watchdog_timeout:
          name: Watchdog timeout
          description: >-
            Safety shutdown for a light that remains on while all motion
            sensors are off. The watchdog never overrides automation-disable,
            permanent-light or active cleaning mode.
          default: 900
          selector:
            number:
              min: 60
              max: 7200
              step: 30
              unit_of_measurement: seconds
              mode: box

    permanent_override:
      name: Permanent light override
      icon: mdi:lightbulb-on-outline
      collapsed: true
      input:
        override_switch:
          name: Permanent-light switch
          description: >-
            Optional. While this entity is on, the blueprint keeps the light
            on and automatic switch-off is suppressed.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch

        override_brightness:
          name: Permanent-light brightness
          default: 100
          selector:
            number:
              min: 1
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    cleaning:
      name: Cleaning mode
      icon: mdi:broom
      collapsed: true
      input:
        cleaning_button:
          name: Cleaning button
          description: >-
            Optional input_button helper. Pressing it sets the light to 100%
            for the configured duration. Pressing it again restarts the period.
            The last button timestamp is used to reconstruct the mode after a
            Home Assistant restart.
          default: ""
          selector:
            entity:
              filter:
                - domain: input_button

        cleaning_duration:
          name: Cleaning duration
          default: 1800
          selector:
            number:
              min: 60
              max: 7200
              step: 60
              unit_of_measurement: seconds
              mode: box

    automation_control:
      name: Automation control
      icon: mdi:robot-off
      collapsed: true
      input:
        automation_disable_switch:
          name: Disable automation
          description: >-
            Optional. While this entity is on, the blueprint does not touch
            the light at all. This differs from permanent-light override,
            which actively keeps the light on.
          default: ""
          selector:
            entity:
              filter:
                - domain:
                    - input_boolean
                    - switch

variables:
  motion_sensors: !input motion_sensors
  light_entity: !input light_entity
  illuminance_sensor: !input illuminance_sensor
  lux_threshold: !input lux_threshold
  normal_brightness: !input normal_brightness
  night_enabled: !input night_enabled
  night_start: !input night_start
  night_end: !input night_end
  night_brightness: !input night_brightness
  color_temp_enabled: !input color_temp_enabled
  normal_color_temp: !input normal_color_temp
  night_color_temp: !input night_color_temp
  override_color_temp: !input override_color_temp
  cleaning_color_temp: !input cleaning_color_temp
  no_motion_wait: !input no_motion_wait
  startup_delay: !input startup_delay
  watchdog_timeout: !input watchdog_timeout
  override_switch: !input override_switch
  override_brightness: !input override_brightness
  cleaning_button: !input cleaning_button
  cleaning_duration: !input cleaning_duration
  automation_disable_switch: !input automation_disable_switch

triggers:
  - trigger: state
    entity_id: !input motion_sensors
    to: "on"
    id: motion_on

  - trigger: state
    entity_id: !input motion_sensors
    to: "off"
    id: motion_off

  - trigger: homeassistant
    event: start
    id: ha_start

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input override_switch
    id: override_changed

  - trigger: event
    event_type: state_changed
    event_data:
      entity_id: !input cleaning_button
    id: cleaning_pressed

  - trigger: time_pattern
    minutes: "/5"
    id: watchdog

actions:
  # Highest priority: when automation is disabled, do absolutely nothing.
  - condition: template
    value_template: >-
      {{ automation_disable_switch == '' or
         not is_state(automation_disable_switch, 'on') }}

  - choose:
      # ------------------------------------------------------
      # Motion ON
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: motion_on
          - condition: template
            value_template: >-
              {{ override_switch == '' or not is_state(override_switch, 'on') }}
          - condition: template
            value_template: >-
              {% if cleaning_button == '' %}
                true
              {% else %}
                {% set s = states(cleaning_button) %}
                {{ s in ['unknown', 'unavailable', ''] or
                   (as_timestamp(now()) - as_timestamp(s, 0)) >= cleaning_duration }}
              {% endif %}
          - condition: template
            value_template: >-
              {% if illuminance_sensor == '' %}
                true
              {% else %}
                {% set value = states(illuminance_sensor) %}
                {{ value not in ['unknown', 'unavailable', ''] and
                   is_number(value) and (value | float) < lux_threshold }}
              {% endif %}
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {% if not night_enabled %}
                        false
                      {% else %}
                        {% set current = now().strftime('%H:%M:%S') %}
                        {% if night_start <= night_end %}
                          {{ current >= night_start and current < night_end }}
                        {% else %}
                          {{ current >= night_start or current < night_end }}
                        {% endif %}
                      {% endif %}
                sequence:
                  - choose:
                      - conditions: "{{ color_temp_enabled }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input night_brightness
                              color_temp_kelvin: !input night_color_temp
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input night_brightness
                          transition: 1
            default:
              - choose:
                  - conditions: "{{ color_temp_enabled }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input normal_brightness
                          color_temp_kelvin: !input normal_color_temp
                          transition: 1
                default:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input normal_brightness
                      transition: 1

      # ------------------------------------------------------
      # Motion OFF -> delay -> verify ALL sensors are still off
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: motion_off
        sequence:
          - delay:
              seconds: !input no_motion_wait
          - condition: template
            value_template: >-
              {{ automation_disable_switch == '' or
                 not is_state(automation_disable_switch, 'on') }}
          - condition: template
            value_template: >-
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: template
            value_template: >-
              {{ override_switch == '' or not is_state(override_switch, 'on') }}
          - condition: template
            value_template: >-
              {% if cleaning_button == '' %}
                true
              {% else %}
                {% set s = states(cleaning_button) %}
                {{ s in ['unknown', 'unavailable', ''] or
                   (as_timestamp(now()) - as_timestamp(s, 0)) >= cleaning_duration }}
              {% endif %}
          - action: light.turn_off
            target:
              entity_id: !input light_entity
            data:
              transition: 2

      # ------------------------------------------------------
      # Permanent-light switch changed to ON
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: override_changed
          - condition: template
            value_template: >-
              {{ override_switch != '' and is_state(override_switch, 'on') }}
        sequence:
          - choose:
              - conditions: "{{ color_temp_enabled }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input override_brightness
                      color_temp_kelvin: !input override_color_temp
                      transition: 1
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: !input override_brightness
                  transition: 1

      # ------------------------------------------------------
      # Permanent-light switch changed to OFF
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: override_changed
          - condition: template
            value_template: >-
              {{ override_switch != '' and not is_state(override_switch, 'on') }}
        sequence:
          - choose:
              # Cleaning mode has next priority.
              - conditions:
                  - condition: template
                    value_template: >-
                      {% if cleaning_button == '' %}
                        false
                      {% else %}
                        {% set s = states(cleaning_button) %}
                        {{ s not in ['unknown', 'unavailable', ''] and
                           (as_timestamp(now()) - as_timestamp(s, 0)) < cleaning_duration }}
                      {% endif %}
                sequence:
                  - choose:
                      - conditions: "{{ color_temp_enabled }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: 100
                              color_temp_kelvin: !input cleaning_color_temp
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: 100
                          transition: 1

              # Motion present: hand control back to normal motion lighting.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {% if not night_enabled %}
                                false
                              {% else %}
                                {% set current = now().strftime('%H:%M:%S') %}
                                {% if night_start <= night_end %}
                                  {{ current >= night_start and current < night_end }}
                                {% else %}
                                  {{ current >= night_start or current < night_end }}
                                {% endif %}
                              {% endif %}
                        sequence:
                          - choose:
                              - conditions: "{{ color_temp_enabled }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input light_entity
                                    data:
                                      brightness_pct: !input night_brightness
                                      color_temp_kelvin: !input night_color_temp
                                      transition: 1
                            default:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light_entity
                                data:
                                  brightness_pct: !input night_brightness
                                  transition: 1
                    default:
                      - choose:
                          - conditions: "{{ color_temp_enabled }}"
                            sequence:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light_entity
                                data:
                                  brightness_pct: !input normal_brightness
                                  color_temp_kelvin: !input normal_color_temp
                                  transition: 1
                        default:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input normal_brightness
                              transition: 1
            default:
              - action: light.turn_off
                target:
                  entity_id: !input light_entity
                data:
                  transition: 2

      # ------------------------------------------------------
      # Cleaning button
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: cleaning_pressed
          - condition: template
            value_template: "{{ cleaning_button != '' }}"
          - condition: template
            value_template: >-
              {{ trigger.event.data.old_state is not none and
                 trigger.event.data.old_state.state not in ['unknown', 'unavailable'] }}
          - condition: template
            value_template: >-
              {{ override_switch == '' or not is_state(override_switch, 'on') }}
        sequence:
          - choose:
              - conditions: "{{ color_temp_enabled }}"
                sequence:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: 100
                      color_temp_kelvin: !input cleaning_color_temp
                      transition: 1
            default:
              - action: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: 100
                  transition: 1

          - delay:
              seconds: !input cleaning_duration

          - condition: template
            value_template: >-
              {{ automation_disable_switch == '' or
                 not is_state(automation_disable_switch, 'on') }}

          # A repeated button press extends cleaning mode. Only the newest run
          # may switch the light back afterwards.
          - condition: template
            value_template: >-
              {% set s = states(cleaning_button) %}
              {{ s in ['unknown', 'unavailable', ''] or
                 (as_timestamp(now()) - as_timestamp(s, 0)) >= cleaning_duration }}

          - choose:
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ override_switch != '' and is_state(override_switch, 'on') }}
                sequence:
                  - choose:
                      - conditions: "{{ color_temp_enabled }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input override_brightness
                              color_temp_kelvin: !input override_color_temp
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input override_brightness
                          transition: 1

              - conditions:
                  - condition: template
                    value_template: >-
                      {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                sequence:
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {% if not night_enabled %}
                                false
                              {% else %}
                                {% set current = now().strftime('%H:%M:%S') %}
                                {% if night_start <= night_end %}
                                  {{ current >= night_start and current < night_end }}
                                {% else %}
                                  {{ current >= night_start or current < night_end }}
                                {% endif %}
                              {% endif %}
                        sequence:
                          - choose:
                              - conditions: "{{ color_temp_enabled }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input light_entity
                                    data:
                                      brightness_pct: !input night_brightness
                                      color_temp_kelvin: !input night_color_temp
                                      transition: 1
                            default:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light_entity
                                data:
                                  brightness_pct: !input night_brightness
                                  transition: 1
                    default:
                      - choose:
                          - conditions: "{{ color_temp_enabled }}"
                            sequence:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light_entity
                                data:
                                  brightness_pct: !input normal_brightness
                                  color_temp_kelvin: !input normal_color_temp
                                  transition: 1
                        default:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input normal_brightness
                              transition: 1
            default:
              - action: light.turn_off
                target:
                  entity_id: !input light_entity
                data:
                  transition: 2

      # ------------------------------------------------------
      # Home Assistant restart fallback
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: ha_start
        sequence:
          - delay:
              seconds: !input startup_delay

          - condition: template
            value_template: >-
              {{ automation_disable_switch == '' or
                 not is_state(automation_disable_switch, 'on') }}

          - choose:
              # Permanent-light override wins after restart.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ override_switch != '' and is_state(override_switch, 'on') }}
                sequence:
                  - choose:
                      - conditions: "{{ color_temp_enabled }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input override_brightness
                              color_temp_kelvin: !input override_color_temp
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input override_brightness
                          transition: 1

              # Reconstruct an active cleaning period from input_button timestamp.
              - conditions:
                  - condition: template
                    value_template: >-
                      {% if cleaning_button == '' %}
                        false
                      {% else %}
                        {% set s = states(cleaning_button) %}
                        {{ s not in ['unknown', 'unavailable', ''] and
                           (as_timestamp(now()) - as_timestamp(s, 0)) < cleaning_duration }}
                      {% endif %}
                sequence:
                  - choose:
                      - conditions: "{{ color_temp_enabled }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: 100
                              color_temp_kelvin: !input cleaning_color_temp
                              transition: 1
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: 100
                          transition: 1

                  - delay:
                      seconds: >-
                        {% set elapsed = as_timestamp(now()) - as_timestamp(states(cleaning_button), 0) %}
                        {{ [cleaning_duration - elapsed, 0] | max | int }}

                  - condition: template
                    value_template: >-
                      {{ automation_disable_switch == '' or
                         not is_state(automation_disable_switch, 'on') }}
                  - condition: template
                    value_template: >-
                      {{ (as_timestamp(now()) - as_timestamp(states(cleaning_button), 0)) >= cleaning_duration }}

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ override_switch != '' and is_state(override_switch, 'on') }}
                        sequence:
                          - choose:
                              - conditions: "{{ color_temp_enabled }}"
                                sequence:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input light_entity
                                    data:
                                      brightness_pct: !input override_brightness
                                      color_temp_kelvin: !input override_color_temp
                                      transition: 1
                            default:
                              - action: light.turn_on
                                target:
                                  entity_id: !input light_entity
                                data:
                                  brightness_pct: !input override_brightness
                                  transition: 1

                      - conditions:
                          - condition: template
                            value_template: >-
                              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count > 0 }}
                        sequence:
                          - choose:
                              - conditions:
                                  - condition: template
                                    value_template: >-
                                      {% if not night_enabled %}
                                        false
                                      {% else %}
                                        {% set current = now().strftime('%H:%M:%S') %}
                                        {% if night_start <= night_end %}
                                          {{ current >= night_start and current < night_end }}
                                        {% else %}
                                          {{ current >= night_start or current < night_end }}
                                        {% endif %}
                                      {% endif %}
                                sequence:
                                  - choose:
                                      - conditions: "{{ color_temp_enabled }}"
                                        sequence:
                                          - action: light.turn_on
                                            target:
                                              entity_id: !input light_entity
                                            data:
                                              brightness_pct: !input night_brightness
                                              color_temp_kelvin: !input night_color_temp
                                              transition: 1
                                    default:
                                      - action: light.turn_on
                                        target:
                                          entity_id: !input light_entity
                                        data:
                                          brightness_pct: !input night_brightness
                                          transition: 1
                            default:
                              - choose:
                                  - conditions: "{{ color_temp_enabled }}"
                                    sequence:
                                      - action: light.turn_on
                                        target:
                                          entity_id: !input light_entity
                                        data:
                                          brightness_pct: !input normal_brightness
                                          color_temp_kelvin: !input normal_color_temp
                                          transition: 1
                                default:
                                  - action: light.turn_on
                                    target:
                                      entity_id: !input light_entity
                                    data:
                                      brightness_pct: !input normal_brightness
                                      transition: 1
                    default:
                      - action: light.turn_off
                        target:
                          entity_id: !input light_entity
                        data:
                          transition: 2

            # No override/cleaning mode: recover a lost switch-off delay.
            default:
              - condition: state
                entity_id: !input light_entity
                state: "on"
              - condition: template
                value_template: >-
                  {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
              - delay:
                  seconds: !input no_motion_wait
              - condition: template
                value_template: >-
                  {{ automation_disable_switch == '' or
                     not is_state(automation_disable_switch, 'on') }}
              - condition: template
                value_template: >-
                  {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
              - condition: template
                value_template: >-
                  {{ override_switch == '' or not is_state(override_switch, 'on') }}
              - condition: template
                value_template: >-
                  {% if cleaning_button == '' %}
                    true
                  {% else %}
                    {% set s = states(cleaning_button) %}
                    {{ s in ['unknown', 'unavailable', ''] or
                       (as_timestamp(now()) - as_timestamp(s, 0)) >= cleaning_duration }}
                  {% endif %}
              - action: light.turn_off
                target:
                  entity_id: !input light_entity
                data:
                  transition: 2

      # ------------------------------------------------------
      # Watchdog
      # ------------------------------------------------------
      - conditions:
          - condition: trigger
            id: watchdog
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: template
            value_template: >-
              {{ expand(motion_sensors) | selectattr('state', 'eq', 'on') | list | count == 0 }}
          - condition: template
            value_template: >-
              {{ override_switch == '' or not is_state(override_switch, 'on') }}
          - condition: template
            value_template: >-
              {% if cleaning_button == '' %}
                true
              {% else %}
                {% set s = states(cleaning_button) %}
                {{ s in ['unknown', 'unavailable', ''] or
                   (as_timestamp(now()) - as_timestamp(s, 0)) >= cleaning_duration }}
              {% endif %}
          - condition: template
            value_template: >-
              {{ (as_timestamp(now()) - as_timestamp(states[light_entity].last_changed)) >= watchdog_timeout }}
        sequence:
          - action: light.turn_off
            target:
              entity_id: !input light_entity
            data:
              transition: 2

# Parallel is intentional: each OFF event may run its own delay, but the light
# is only switched off after re-checking all motion sensors and all overrides.
mode: parallel
max: 20
max_exceeded: silent
